name: Release Please

# Every push to main is read by release-please: feat: commits ask for a minor, fix: for a patch,
# a ! or a BREAKING CHANGE footer for a major. It keeps one pull request open ("chore(main):
# release x.y.z") with CHANGELOG.md and the versions bumped, built from the squash-merge titles
# of the pull requests. Merging that pull request creates the tag vx.y.z and the GitHub release
# with the same notes. Nothing else to do by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Keep the release pull request, publish on merge
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
