name: YAML

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parse:
    name: Frontmatter and YAML parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse every frontmatter block and YAML file
        run: node scripts/check-yaml.mjs
