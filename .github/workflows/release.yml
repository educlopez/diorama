name: Release by hand

# The releases come from release-please (see release-please.yml): a merge of its release pull
# request creates the tag and the GitHub release. This workflow is the hand lever for the rare
# case outside that flow, such as a version that needs a tag on an older commit: run it with the
# version (and, if not the branch's head, the commit to tag) and it creates the tag and the
# release in one go, with the notes taken from that version's section of CHANGELOG.md. It fails
# and publishes nothing when the section is missing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, like 1.2.0 (the tag is v1.2.0)'
        required: true
        type: string
      target:
        description: 'The commit to tag; empty tags the head of the branch this runs on'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish the release from the changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take this version's notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          python3 - "$v" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          sys.stdout.write(m.group(1).strip() + "\n" if m else "")
          PY
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no [$v] section"; exit 1; fi
          cat notes.md
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          v="${VERSION#v}"
          gh release create "v$v" --target "${TARGET:-$GITHUB_SHA}" --title "Diorama v$v" --notes-file notes.md
