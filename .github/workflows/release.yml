name: Release

# Push a tag like v1.2.0 and this publishes the GitHub release for it, with the notes
# taken from that version's section of CHANGELOG.md. The tag's own commit must carry
# the section, or the job fails and nothing is published.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish the release from the changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take this version's notes from CHANGELOG.md
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          sys.stdout.write(m.group(1).strip() + "\n" if m else "")
          PY
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no [${GITHUB_REF_NAME#v}] section"; exit 1; fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Diorama $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
