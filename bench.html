<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{--page:#f3f5fa;--ink:#1b2638;--ink-2:#56667f;--ink-3:#8796ab;--line:rgba(28,44,74,.10);--card:#ffffff;--accent:#2f5be0;
    --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
  .wrap{width:100%;display:grid;gap:14px;justify-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(20,34,60,.05),0 12px 32px rgba(20,34,60,.08);overflow:hidden}
  .head{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0;font-family:var(--f-display)}
  .head .n{font-weight:800;font-size:15px}
  .head .k{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .stage{position:relative;width:100%;background:transparent}
  .stage canvas{display:block}
  .means{padding:10px 18px 16px;font-size:14px;color:var(--ink-2);line-height:1.45}
  .means b{color:var(--ink)}
  .hero{width:min(1100px,100%)}
  .hero .stage{margin:12px 0 0}
  .cardsize{width:min(520px,100%)}
  .cardsize .stage{margin-top:12px}
  .minisize{width:min(360px,100%)}
  .minisize .stage{width:220px;margin:12px auto 0}
  .foot{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-3)}
  .foot button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
  .foot button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
  .foot .themes{display:inline-flex;gap:4px;padding-left:8px;border-left:1px solid var(--line)}
  .foot .swatches{display:inline-flex;gap:6px;align-items:center;padding-left:10px;border-left:1px solid var(--line)}
  .foot .swatches button{width:18px;height:18px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .foot .swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
  .foot .read{min-width:12ch;font-variant-numeric:tabular-nums}
  .foot .read b{color:var(--ink-2);font-weight:600}
  .err{color:#d24b42;font-size:13px;padding:12px 18px}
  html.embed,body.embed{background:transparent}
  body.embed{padding:0;display:block;min-height:0}
  body.embed .wrap{gap:0}
  body.embed .card{width:100%;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0}
  body.embed .head,body.embed .means,body.embed .foot{display:none}
  body.embed .stage{margin:0;width:100%}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
/*KERNEL*/
</script>
<script>
/*FIGURE*/
</script>
<script>
(function () {
  var fig = Diorama.figures[Diorama.figures.length - 1];
  var wrap = document.getElementById('wrap');
  var q = new URLSearchParams(location.search);
  if (!fig) { wrap.innerHTML = '<div class="card cardsize"><div class="err">No figure declared: the page needs one Diorama.figure({ … }) call.</div></div>'; return; }
  document.title = fig.name + ' · Diorama';
  if (q.has('embed')) { document.body.classList.add('embed'); document.documentElement.classList.add('embed'); }
  var card = document.createElement('div');
  var stage = document.createElement('div'); stage.className = 'stage'; stage.id = 'stage';
  var means = fig.means || '';
  {
    card.className = 'card ' + (fig.size === 'hero' ? 'hero' : fig.size === 'mini' ? 'minisize' : 'cardsize');
    var head = document.createElement('div'); head.className = 'head';
    head.innerHTML = '<span class="n"></span><span class="k"></span>';
    head.querySelector('.n').textContent = fig.title || fig.name; head.querySelector('.k').textContent = fig.size || 'card';
    card.appendChild(head); card.appendChild(stage);
    var m = document.createElement('div'); m.className = 'means'; m.textContent = means + (fig.hint ? ' ' : ''); if (fig.hint) { var hb = document.createElement('b'); hb.textContent = fig.hint; m.appendChild(hb); } card.appendChild(m);
  }
  wrap.appendChild(card);
  var foot = document.createElement('div'); foot.className = 'foot';
  var still = document.createElement('button'); still.type = 'button'; still.textContent = 'Still frame'; still.setAttribute('aria-pressed', 'false');
  var note = document.createElement('span'); note.className = 'read'; note.setAttribute('aria-live', 'polite'); note.textContent = 'Move the pointer over the scene.';
  foot.appendChild(still); foot.appendChild(note); wrap.appendChild(foot);
  var ctx, figAccent = fig.theme && typeof fig.theme === 'object' ? fig.theme.accent : null;
  var figBase = typeof fig.theme === 'object' ? fig.theme.base || 'toy' : fig.theme || 'toy';
  /* a theme picked here swaps the look and keeps the figure's own accent, which is the brand's colour; a swatch
     (or ?accent=hex) recolours the subject, which every figure paints with pal.accent */
  var themePick = q.get('theme') || null, accentPick = q.get('accent') ? '#' + q.get('accent').replace(/^#/, '') : null;
  function picked() { var a = accentPick || figAccent; return themePick || accentPick ? (a ? { base: themePick || figBase, accent: a } : themePick) : undefined; }
  if (figAccent) document.documentElement.style.setProperty('--accent', figAccent);
  function mountIt(reduced) {
    if (ctx) ctx.destroy();
    try { ctx = Diorama.mount(fig, { el: stage, reduced: reduced, still: q.has('t') ? +q.get('t') : undefined, theme: picked() }); window.__diorama = ctx; }
    catch (err) { stage.innerHTML = '<div class="err">' + (err && err.message || err) + '</div>'; console.error(err); }
  }
  var themes = Object.keys(Diorama.THEMES), sel = document.createElement('span'); sel.className = 'themes';
  themes.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.dataset.theme = t;
    b.setAttribute('aria-pressed', String(t === (themePick || figBase)));
    b.addEventListener('click', function () { themePick = t; sel.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); mountIt(isStill); });
    sel.appendChild(b);
  });
  foot.insertBefore(sel, note);
  /* the swatches: the figure's own accent first, then five of the palette's */
  var own = figAccent || Diorama.PAL.coral, sw = document.createElement('span'); sw.className = 'swatches'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Accent');
  [['own', own], ['mustard', Diorama.PAL.mustard], ['mint', Diorama.PAL.mint], ['cobalt', Diorama.PAL.cobalt], ['rose', Diorama.PAL.rose], ['plum', Diorama.PAL.plum]].forEach(function (s) {
    if (s[0] !== 'own' && s[1].toLowerCase() === own.toLowerCase()) return;
    var b = document.createElement('button'); b.type = 'button'; b.style.background = s[1]; b.dataset.accent = s[1]; b.title = s[0] === 'own' ? 'the figure’s own accent' : s[0]; b.setAttribute('aria-label', 'Accent ' + s[0]);
    b.setAttribute('aria-pressed', String((accentPick || own).toLowerCase() === s[1].toLowerCase()));
    b.addEventListener('click', function () { accentPick = s[0] === 'own' ? null : s[1]; sw.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); mountIt(isStill); });
    sw.appendChild(b);
  });
  foot.insertBefore(sw, note);
  var isStill = q.has('still');
  mountIt(isStill); still.setAttribute('aria-pressed', String(isStill));
  still.addEventListener('click', function () { isStill = !isStill; still.setAttribute('aria-pressed', String(isStill)); mountIt(isStill); });
  /* the read-out: what the pointer is on, what is switched on, or what the figure says it is doing */
  function readout() {
    if (!ctx) return '';
    if (ctx.hover) return ctx.hover.name || 'something';
    if (ctx.active) return (ctx.active.name || 'something') + ' · on';
    return ctx.read || '';
  }
  var lastRead = null, inFrame = q.has('embed') && window.parent !== window;
  (function watch() {
    var h = readout();
    if (h !== lastRead) {
      lastRead = h;
      if (h) { note.textContent = ''; var b = document.createElement('b'); b.textContent = h; note.appendChild(b); } else note.textContent = 'Move the pointer over the scene.';
      if (inFrame) { try { window.parent.postMessage({ type: 'diorama', name: fig.name, hover: h }, '*'); } catch (e) {} }
    }
    requestAnimationFrame(watch);
  })();
  /* in a frame: take a theme, an accent or a still request from the parent */
  if (inFrame) {
    window.addEventListener('message', function (e) {
      var d = e.data; if (!d || d.type !== 'diorama') return;
      if (d.theme !== undefined) { themePick = d.theme || null; sel.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.theme === (themePick || figBase))); }); mountIt(isStill); }
      if (d.accent !== undefined) { accentPick = d.accent || null; sw.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.accent.toLowerCase() === (accentPick || own).toLowerCase())); }); mountIt(isStill); }
      if (d.still !== undefined) { isStill = !!d.still; still.setAttribute('aria-pressed', String(isStill)); mountIt(isStill); }
    });
    var hello = function () { try { window.parent.postMessage({ type: 'diorama', name: fig.name, ready: true, hint: fig.hint || '', hot: (ctx && ctx.parts && ctx.parts.hot ? ctx.parts.hot.map(function (g) { return g.name; }).filter(Boolean) : []) }, '*'); } catch (e) {} };
    window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'diorama' && d.hello) hello(); });
    hello();
  }
})();
</script>
</body>
</html>
