<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; background: #ffffff; color: #4a4d55; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; box-sizing: border-box; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; }
  p { margin: 0; max-width: 60ch; text-align: center; text-wrap: balance; }
  .soft { color: #7a7d85; font-size: 13px; }
  .read { min-height: 1.45em; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #5a5d65; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; color: #2c2f36; }
  @media (max-width: 420px) { main { padding: 12px 8px; } }
  .embed main { min-height: 0; padding: 0; gap: 0; position: relative; }
  .embed canvas { width: 100% !important; height: auto !important; max-width: none; }
  .embed h1, .embed #means, .embed #hint { display: none; }
  .embed .read { position: absolute; left: 10px; bottom: 8px; text-align: left; background: rgba(255, 255, 255, .88); padding: 0 6px; border-radius: 4px; }
  .embed .read:empty { display: none; }
</style>
</head>
<body>
<main>
  <canvas id="stage" role="img"></canvas>
  <h1 id="title"></h1>
  <p id="means"></p>
  <p id="hint" class="soft"></p>
  <p id="read" class="read" aria-live="polite"></p>
</main>
<script>
/*KERNEL*/
</script>
<script>
/*SCENE*/
</script>
<script>
(function () {
  var spec = Pixel.scenes[Pixel.scenes.length - 1], canvas = document.getElementById('stage');
  var q = new URLSearchParams(location.search), embed = q.has('embed');
  if (embed) document.documentElement.className = 'embed';
  document.getElementById('title').textContent = spec.title || spec.name;
  document.getElementById('means').textContent = spec.means || '';
  document.getElementById('hint').textContent = spec.hint || '';
  var read = document.getElementById('read');
  canvas.setAttribute('aria-label', spec.means || spec.title || spec.name);
  var rt = Pixel.mount(spec, canvas, { still: q.has('still'), reduced: q.has('reduced') ? true : undefined, onRead: function (line) { read.textContent = line; } });
  /* whole-number enlargement so every pixel is the same size */
  function fit() {
    if (embed) return;
    var avail = canvas.parentElement.clientWidth;
    var k = Math.floor(avail / canvas.width);
    if (k < 1) k = 1;
    canvas.style.width = (canvas.width * k) + 'px';
    canvas.style.height = (canvas.height * k) + 'px';
  }
  fit(); addEventListener('resize', fit);
  window.__dither = { spec: spec, runtime: rt };
})();
</script>
</body>
</html>
